name: Build Alex Friend Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8 (required by ForgeGradle 2 / Forge 1.12.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Extract AlexFriendMod.zip
        run: |
          set -e
          rm -rf build_work
          mkdir -p build_work
          unzip -q AlexFriendMod.zip -d build_work
          GRADLE_FILE="$(find build_work -maxdepth 3 -name build.gradle | head -n 1)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle not found inside AlexFriendMod.zip" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"
          echo "Extracted project:"
          ls -la "$(dirname "$GRADLE_FILE")"

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-forge-1.12.2-${{ hashFiles('AlexFriendMod.zip') }}
          restore-keys: |
            gradle-forge-1.12.2-

      - name: Install Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Check Forge 1.12.2 download sources (diagnostics)
        continue-on-error: true
        run: |
          V=1.12.2-14.23.5.2860
          for base in https://maven.minecraftforge.net https://files.minecraftforge.net/maven https://bmclapi2.bangbang93.com/maven; do
            echo "=================== $base"
            echo "--- files listed in the version folder:"
            curl -sL -m 30 "$base/net/minecraftforge/forge/$V/" | grep -oE 'forge-[A-Za-z0-9._-]+\.(jar|zip|txt)' | sort -u || true
            for c in userdev userdev3 universal; do
              code=$(curl -s -o /dev/null -L -m 30 -w '%{http_code}' "$base/net/minecraftforge/forge/$V/forge-$V-$c.jar" || echo curl-failed)
              echo "forge-$V-$c.jar -> HTTP $code"
            done
          done

      - name: Build mod jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AlexFriend-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
